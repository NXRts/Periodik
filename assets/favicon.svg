<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background Rounded Icon Container -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  
  <!-- Outer Ring / Border -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#334155" stroke-width="2"/>
  
  <!-- Atom Orbits -->
  <g stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.85">
    <!-- Horizontal Orbit -->
    <ellipse cx="32" cy="32" rx="22" ry="8" transform="rotate(0 32 32)"/>
    <!-- Diagonal Orbit 1 -->
    <ellipse cx="32" cy="32" rx="22" ry="8" transform="rotate(60 32 32)"/>
    <!-- Diagonal Orbit 2 -->
    <ellipse cx="32" cy="32" rx="22" ry="8" transform="rotate(120 32 32)"/>
  </g>
  
  <!-- Nucleus -->
  <circle cx="32" cy="32" r="5" fill="#2563eb"/>
  
  <!-- Electrons -->
  <circle cx="54" cy="32" r="2.5" fill="#f43f5e"/>
  
  <circle cx="21" cy="13" r="2.5" fill="#f43f5e"/>
  
  <circle cx="21" cy="51" r="2.5" fill="#f43f5e"/>
</svg>
